plugins {
    id 'java'
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

def minecraftVersion = providers.gradleProperty('minecraft_version').orElse('26.2').get()
def yarnMappings = providers.gradleProperty('yarn_mappings').orNull()
def loaderVersion = providers.gradleProperty('loader_version').orElse('0.19.3').get()
def fabricApiVersion = providers.gradleProperty('fabric_api_version').orElse('0.158.0+26.2').get()

def useYarnMappings = minecraftVersion == '1.21.11' && yarnMappings != null && !yarnMappings.trim().isEmpty()

group = 'com.github.synacnipo'
version = '1.0.0'
base {
    archivesName = "RemoveTellRaw-Fabric-${minecraftVersion}"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (useYarnMappings) {
        mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    } else {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    splitEnvironmentSourceSets()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    inputs.property 'loader_version', loaderVersion

    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft_version': minecraftVersion,
            'loader_version': loaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 21
}
