name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: oracle
          cache: maven

      - name: Build Paper plugin
        run: mvn -B -DskipTests package

      - name: Upload Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoveTellRaw-Paper
          path: target/*.jar

  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            yarn: 1.21.11+build.6
            loader: 0.19.3
            fabric_api: 0.141.6+1.21.11
          - minecraft: 26.1
            yarn: 26.1+build.3
            loader: 0.19.3
            fabric_api: 0.145.1+26.1
          - minecraft: 26.1.1
            yarn: 26.1.1+build.1
            loader: 0.19.3
            fabric_api: 0.145.4+26.1.1
          - minecraft: 26.1.2
            yarn: 26.1.2+build.1
            loader: 0.19.3
            fabric_api: 0.155.2+26.1.2
          - minecraft: 26.2
            yarn: 26.2+build.1
            loader: 0.19.3
            fabric_api: 0.158.0+26.2

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric mod for ${{ matrix.minecraft }}
        working-directory: ./fabric
        run: |
          gradle build \
            -Pminecraft_version=${{ matrix.minecraft }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Ploader_version=${{ matrix.loader }} \
            -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoveTellRaw-Fabric-${{ matrix.minecraft }}
          path: fabric/build/libs/*.jar

      - name: Create Release
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            target/*.jar
            fabric/build/libs/*.jar
          tag: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}

            Included versions:
            - 1.21.11
            - 26.1
            - 26.1.1
            - 26.1.2
            - 26.2
          removeArtifacts: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
